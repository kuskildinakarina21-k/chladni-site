    <title>Твой танцующий паттерн</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #3a3a3a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .mask-layer {
            width: 95vh;
            height: 95vh;
            position: relative;
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 80%);
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 80%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        /* Группы колец будут двигаться независимо */
        .ring-1 { transition: transform 0.08s ease-out; transform-origin: 565px 565px; }
        .ring-2 { transition: transform 0.10s ease-out; transform-origin: 565px 565px; }
        .ring-3 { transition: transform 0.12s ease-out; transform-origin: 565px 565px; }
        .ring-4 { transition: transform 0.14s ease-out; transform-origin: 565px 565px; }

        .start-btn {
            position: absolute;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .start-btn:hover { background: white; }
    </style>
