<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анимированный паттерн под звук</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #4a4a4a; /* Цвет фона */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Контейнер паттерна */
        .pattern-wrapper {
            width: 80vh; /* Размер паттерна */
            height: 80vh;
            position: relative;
            
            /* ВРАЩЕНИЕ: медленное и постоянное */
            animation: spin 20s linear infinite;
            
            /* ПУЛЬСАЦИЯ: будет меняться через JS */
            transform: scale(1);
            transition: transform 0.05s ease-out; /* Плавная реакция */
        }

        /* Вращение по кругу */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .pattern-svg {
            width: 100%;
            height: 100%;
        }

        /* Кнопка запуска микрофона */
        .start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 25px 50px;
            font-size: 24px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .start-btn:hover {
            background: white;
        }
    </style>
</head>

    <script>
        const container = document.getElementById('container');
        const btn = document.getElementById('startBtn');

        btn.addEventListener('click', async () => {
            try {
                // 1. Просим доступ к микрофону
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                source.connect(analyser);

                analyser.fftSize = 256;
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                // Прячем кнопку
                btn.style.display = 'none';

                // 2. Запускаем бесконечное чтение звука
                function animate() {
                    analyser.getByteFrequencyData(dataArray);

                    // Считаем общую громкость (суммируем все частоты)
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) {
                        sum += dataArray[i];
                    }
                    
                    // Переводим в масштаб от 0 до 1
                    let avgVolume = sum / (dataArray.length * 255);
                    
                    // Если тихо, делаем паттерн маленьким, если громко - большим
                    // 0.9 = базовый размер, + 0.4 = максимальное увеличение
                    let scale = 0.9 + (avgVolume * 0.4);

                    // Применяем масштаб к паттерну (ВРАЩЕНИЕ сохраняется!)
                    container.style.transform = `scale(${scale})`;

                    requestAnimationFrame(animate);
                }

                animate();

            } catch (err) {
                alert("Нужно разрешить доступ к микрофону!");
                console.error(err);
            }
        });
    </script>
</body>
</html>
