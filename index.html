<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chladni Pattern - Микрофон</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #4a4a4a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .pattern-container {
            width: 80vh;
            height: 80vh;
            pointer-events: none;
            position: relative;
            animation: spin 20s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .pattern-svg {
            width: 100%;
            height: 100%;
            /* Начальный масштаб */
            transform: scale(1); 
            opacity: 0.9;
        }

        .start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .start-btn:hover {
            background: white;
            transform: translate(-50%, -50%) scale(1.05);
        }
    </style>
</head>
